[package]
name = "app"
version = "0.1.0"
description = "DARKROOM 暗房 - 照片打印预处理"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "rayon"] }
kamadak-exif = "0.6"
resvg = "0.49"
usvg = "0.49"
rayon = "1.10"
walkdir = "2"
tempfile = "3"
thiserror = "2"
base64 = "0.22"
rfd = "0.17"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Graphics_Imaging",
] }
